<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0a141c"/>
  <!-- Three overlapping dial rings -->
  <circle cx="11" cy="16" r="7" fill="none" stroke="#0ea5e9" stroke-width="2.4"/>
  <circle cx="20" cy="16" r="7" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
  <!-- Tick marks (dial indicators) -->
  <line x1="11" y1="9.5" x2="11" y2="11.5" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="9.5" x2="20" y2="11.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
</svg>
